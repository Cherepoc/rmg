<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generate MIDI</title>
    <style>
        html,body{height:100%;}
        body{
            margin:0;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background:#f7f7f8;
        }
        .btn{
            appearance:none;
            -webkit-appearance:none;
            border:1px solid rgba(0,0,0,0.12);
            background:#ffffff;
            padding:12px 20px;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            box-shadow:0 6px 18px rgba(0,0,0,0.04);
        }
        .btn:active{transform:translateY(1px);}
        a{ text-decoration:none; }
    </style>
</head>
<body>
<!-- Button links to the relative URL "generate" -->
<a href="generate" aria-label="Generate MIDI">
    <button class="btn" type="button">generate midi</button>
</a>
</body>
</html>
