<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
    The browser's fonts, the machine's own but its sans-serif and system-ui Liberation Sans, as wide as Arial: a layout
    test measures the same text on every machine, rather than DejaVu Sans, wider than a phone's Roboto, where a
    machine's fonts make it the default (Site.Fonts).
-->
<fontconfig>
    <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
    <alias binding="strong">
        <family>sans-serif</family>
        <prefer><family>Liberation Sans</family></prefer>
    </alias>
    <alias binding="strong">
        <family>system-ui</family>
        <prefer><family>Liberation Sans</family></prefer>
    </alias>
</fontconfig>
